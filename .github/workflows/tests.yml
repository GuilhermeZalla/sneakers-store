name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - name: Install backend
        working-directory: sneakers-store-backend
        run: composer setup
      - name: Check backend
        working-directory: sneakers-store-backend
        run: composer ci:check
      - name: Install frontend
        working-directory: sneakers-store-frontend
        run: npm ci
      - name: Check frontend
        working-directory: sneakers-store-frontend
        run: |
          npm test
          npm run types:check
          npm run check
          npm run build
          npm run build:demo
      - name: Upload static demo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sneakers-store-frontend/dist

  deploy-demo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@v4
